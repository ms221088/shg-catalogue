<!DOCTYPE html>
<html lang="hi">
<head>
  <title>SHG Catalogue</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

</head>
<body>

<div id="header"></div>

<main class="container" id="main-content">
  <h1 data-hi="स्वयं सहायता समूह उत्पाद एवं सेवाएँ"
      data-en="Products & Services of Budaun's Self Help Groups"></h1>

  <p data-hi="बदायूं जिले के स्वयं सहायता समूहों द्वारा निर्मित उत्पाद एवं सेवाएँ"
     data-en="Products and services created by Self Help Groups of Budaun"></p>

  <div class="home-buttons">

  <a href="products.html"
     class="btn-primary"
     data-en="For Products Click Here"
     data-hi="उत्पाद देखने के लिए यहाँ क्लिक करें">
     For Products Click Here
  </a>

  <a href="services.html"
     class="btn-secondary"
     data-en="For Services Click Here"
     data-hi="सेवाएँ देखने के लिए यहाँ क्लिक करें">
     For Services Click Here
  </a>

</div>

<section class="appeal">
  <h2 
    data-hi="वोकल फॉर लोकल"
    data-en="Vocal for Local">
    Vocal for Local
  </h2>

  <p 
    data-hi="बदायूं के स्वयं सहायता समूहों द्वारा प्रदान किए जा रहे उत्पादों एवं सेवाओं को अपनाएं। स्थानीय उद्यमों का चयन कर आप महिला सशक्तिकरण, ग्रामीण आजीविका एवं जनपद की अर्थव्यवस्था को सुदृढ़ बनाने में महत्वपूर्ण योगदान देते हैं।"
    data-en="Support products and services offered by Self Help Groups of Budaun. By choosing local enterprises, you directly contribute to women empowerment, rural livelihoods, and strengthening the district economy.">
    Support products and services offered by Self Help Groups of Budaun. By choosing local enterprises, you directly contribute to women empowerment, rural livelihoods, and strengthening the district economy.
  </p>
</section>

</main>

<div id="footer"></div>

<script src="lang.js"></script>
<script src="script.js"></script>
<script>
Promise.all([
  fetch("header.html").then(r => r.text()).then(d => { document.getElementById("header").innerHTML = d; }),
  fetch("footer.html").then(r => r.text()).then(d => { document.getElementById("footer").innerHTML = d; })
]).then(() => {
  highlightActiveNav();
  setLang(localStorage.getItem("lang") || "hi");
});
</script>

</body>
</html>
