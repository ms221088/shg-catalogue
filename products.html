<!DOCTYPE html>
<html lang="hi">
<head>
  <title>Products</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>

<div id="header"></div>

<main class="container" id="main-content">
  <nav class="breadcrumb">
    <a href="index.html" data-hi="होम" data-en="Home"></a>
    <span>›</span>
    <span class="current"></span>
  </nav>

  <div class="filters">

  <div class="filter-item">
    <label data-hi="श्रेणी" data-en="Category"></label>
    <select id="fCategory" onchange="filterItems()">
      <option value="" data-hi="सभी" data-en="All">All</option>
      <option value="food" data-hi="खाद्य" data-en="Food">Food</option>
      <option value="home" data-hi="घरेलू" data-en="Home">Home</option>
      <option value="apparel" data-hi="कपड़े" data-en="Apparel">Apparel</option>
      <option value="home-decor" data-hi="घर की सजावट" data-en="Home-Decor">Home-Decor</option>
    </select>
  </div>

  <div class="filter-item">
    <label data-hi="उप-श्रेणी" data-en="Subcategory"></label>
    <select id="fSubcategory" onchange="filterItems()">
      <option value="" data-hi="सभी" data-en="All">All</option>
      <option value="pickle" data-hi="अचार" data-en="Pickle">Pickle</option>
      <option value="milk-products" data-hi="दुग्ध उत्पाद" data-en="Milk Products">Milk Products</option>
      <option value="ghee" data-hi="गाय के दूध का घी" data-en="Cow Milk Ghee">Cow Milk Ghee</option>
      <option value="masale" data-hi="मसाले" data-en="Spices">Spices</option>
      <option value="flour" data-hi="विभिन्न प्रकार का आँटा" data-en="Multi-Grain Flour">Multi-Grain Flour</option>
      <option value="candle" data-hi="मोमबत्ती" data-en="Candle">Candle</option>
      <option value="paint" data-hi="पेंट" data-en="Paint">Paint</option>
      
    </select>
  </div>

  <div class="filter-item">
    <label data-hi="विकासखण्ड" data-en="Block"></label>
    <select id="fBlock" onchange="filterItems()">
      <option value="" data-hi="सभी" data-en="All">All</option>
      <option value="dataganj" data-hi="दातागंज" data-en="Dataganj">Dataganj</option>
      <option value="salarpur" data-hi="सालारपुर" data-en="Salarpur">Salarpur</option>
    </select>
  </div>

  <div class="filter-item">
    <label data-hi="नाम से खोजें" data-en="Search by Name"></label>
    <input type="text" id="fSearch" onkeyup="filterItems()" placeholder="Search...">
  </div>

</div>

<p id="resultCount"></p>
<p id="noResults" style="display:none;" 
   data-hi="कोई परिणाम नहीं मिला"
   data-en="No results found">
   No results found
</p>

  <div class="card"
     data-category="home"
     data-subcategory="paint"
     data-block="salarpur"
     data-name="paint">
    <div>
      <h3 data-hi="प्राकृतिक पेंट - गाय के गोबर से निर्मित" data-en="Natural Paint - Made using Cow Dung"></h3>
      <p data-hi="मूल्य: इमल्शन ₹156.35 प्रति लीटर (₹132.5 + 18% जी एस टी)" data-en="Price: Emulsion ₹156.35 per litre (₹132.5 + 18% GST)"></p>
      <p data-hi="     डिस्टेंपर ₹82.6 per litre (₹70 + 18% जी एस टी)" data-en="      Distemper ₹82.6 per litre (₹70 + 18% GST)"></p>
      <p data-hi="संपर्क: 9720572572 / 8077913715" data-en="Contact: 9720572572 / 8077913715"></p>
      <p data-hi="शिव पार्वती महिला स्वयं सहायता समूह, घटपुरी ग्रा.पं, सालारपुर विकासखण्ड" data-en="Shiv Parwati Mahila Self Help Group, Ghatpuri gram panchayat, Salarpur Block"></p>
     <!-- <button onclick="goBack()">Back</button> -->
    </div>
    <img src="images/NaturalPaintShivParwatiSHGSalarpur.jpg" alt="natural - cow dung based - paint">
  </div>
  
  <div class="card"
     data-category="food"
     data-subcategory="pickle"
     data-block="dataganj"
     data-name="pickle">
    <div>
      <h3 data-hi="स्वादिष्ट अचार" data-en="Tasty Pickles"></h3>
      <p data-hi="मूल्य: ₹120 / किलो " data-en="Price: ₹100 / किलो"></p>
      <p data-hi="संपर्क: 9690934064" data-en="Contact: 9690934064"></p>
      <p data-hi="रौशनी महिला स्वयं सहायता समूह, दातागंज" data-en="Roshni Mahila Self Help Group, Dataganj"></p>
     <!-- <button onclick="goBack()">Back</button> -->
    </div>
    <img src="images/mixPickle.jpg" alt="Swadisht Pickles">
  </div>
  
  <div class="card"
     data-category="food"
     data-subcategory="masale"
     data-block="qadarchowk"
     data-name="masale">
    <div>
      <h3 data-hi="पिसे मसाले व आँटा" data-en="Ground Spices & Flour"></h3>
      <p data-hi="मूल्य: ₹120 / किलो " data-en="Price: ₹100 / किलो"></p>
      <p data-hi="संपर्क: 9837871292" data-en="Contact: 9837871292"></p>
      <p data-hi="दुर्गा माँ महिला स्वयं सहायता समूह, कचौरा ग्रां.पं, क़ादरचौक" data-en="Durga Maa Mahila Self Help Group, Kachoura Gram Panchayat, Qadarchowk"></p>
    </div>
    <img src="images/mixPickle.jpg" alt="Swadisht Pickles">
  </div>
  
</main>

<div id="footer"></div>

<script src="lang.js"></script>
<script src="script.js"></script>
<script>
fetch("header.html").then(r=>r.text()).then(d=>{
  document.getElementById("header").innerHTML=d;
  setLang(localStorage.getItem("lang")||"hi");
});
fetch("footer.html").then(r=>r.text()).then(d=>{
  document.getElementById("footer").innerHTML=d;
});
</script>

</body>
</html>
