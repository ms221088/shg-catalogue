<!DOCTYPE html>
<html lang="hi">
<head>
  <title>Services</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>

<div id="header"></div>

<main class="container" id="main-content">
  <nav class="breadcrumb">
    <a href="index.html" data-hi="होम" data-en="Home"></a>
    <span>›</span>
    <span class="current"></span>
  </nav>

  <div class="filters">

    <div class="filter-item">
      <label data-hi="श्रेणी" data-en="Category"></label>
      <select id="fCategory" onchange="filterItems()"></select>
    </div>

    <div class="filter-item">
      <label data-hi="उप-श्रेणी" data-en="Subcategory"></label>
      <select id="fSubcategory" onchange="filterItems()"></select>
    </div>

    <div class="filter-item">
      <label data-hi="विकासखण्ड" data-en="Block"></label>
      <select id="fBlock" onchange="filterItems()"></select>
    </div>

    <div class="filter-item">
      <label data-hi="नाम से खोजें" data-en="Search by Name"></label>
      <input type="text" id="fSearch" onkeyup="filterItems()" placeholder="Search...">
    </div>

  </div>

  <p id="resultCount"></p>
  <p id="noResults" style="display:none;"
     data-hi="कोई परिणाम नहीं मिला"
     data-en="No results found">
     No results found
  </p>

  <div id="cardsContainer"></div>

</main>

<div id="footer"></div>

<script src="data-blocks.js"></script>
<script src="data-services.js"></script>
<script src="catalogue.js"></script>
<script src="lang.js"></script>
<script src="script.js"></script>
<script>
Promise.all([
  fetch("header.html").then(r => r.text()).then(d => { document.getElementById("header").innerHTML = d; }),
  fetch("footer.html").then(r => r.text()).then(d => { document.getElementById("footer").innerHTML = d; })
]).then(() => {
  highlightActiveNav();
  initCatalogue(SERVICES, SERVICE_LABELS);
  setLang(localStorage.getItem("lang") || "hi");
});
</script>

</body>
</html>
